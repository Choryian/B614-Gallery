<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>추억 퀴즈룸 · B614</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/quiz.css" />
</head>
<body class="page-quiz">
  <canvas id="starfield" aria-hidden="true"></canvas>

  <main class="quiz-wrap">
    <a class="quiz-back ghost-link" href="lobby.html">← 로비</a>

    <!-- 문제 화면 -->
    <section class="quiz-stage" id="quizStage">
      <header class="quiz-head">
        <p class="kicker">B614 추억 퀴즈</p>
        <div class="quiz-progress" id="quizProgress" aria-hidden="true"></div>
      </header>

      <div class="q-card" id="qCard">
        <span class="q-diff" id="qDiff">하</span>
        <h2 class="q-text" id="qText">문제를 불러오는 중…</h2>
        <ul class="q-options" id="qOptions"></ul>
      </div>
      <p class="q-hint">3문제를 모두 맞히면 친구들이 기다리고 있어요.</p>
    </section>

    <!-- 오답(재도전) 화면 -->
    <section class="quiz-result fail hidden" id="failScreen">
      <div class="result-inner">
        <p class="result-kicker">아쉬워요!</p>
        <h2 class="result-title">한 문제를 놓쳤어요</h2>
        <p class="result-msg" id="failMsg">그 시절 기억을 더 더듬어 볼까요? 다시 도전해 보세요.</p>
        <div class="result-btns">
          <button class="enter-btn" id="failRetry">재도전</button>
          <a class="ghost-link big" href="lobby.html">로비로 가기</a>
        </div>
      </div>
    </section>

    <!-- 정답(축하) 화면 -->
    <section class="quiz-result win hidden" id="successScreen">
      <div class="confetti" id="confetti" aria-hidden="true"></div>
      <div class="result-inner">
        <p class="result-kicker">축하합니다!</p>
        <h2 class="result-title">3문제 모두 정답!</h2>
        <figure class="celebrate">
          <img id="celebrateImg" alt="우리 반 친구들이 축하합니다" src="assets/photos/p003_img06.jpeg"
               onerror="this.style.display='none'" />
          <figcaption>6학년 14반 친구들 모두가 축하합니다</figcaption>
        </figure>
        <div class="result-btns">
          <button class="enter-btn" id="winRetry">재도전</button>
          <a class="ghost-link big" href="lobby.html">로비로 가기</a>
        </div>
      </div>
    </section>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/starfield.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
