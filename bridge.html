<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>상영관 · B614</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/bridge.css" />
</head>
<body class="bridge-body">
  <main class="cinema" id="cinema" aria-label="B614 상영관">
    <!-- 실제 영화관 사진을 배경으로, 사진 속 스크린 위치에 영상 재생 -->
    <div class="cinema-photo">
      <div class="screen" id="screen">
        <!-- 로딩 -->
        <div class="reel-loader" id="reelLoader">
          <div class="reel-spin" aria-hidden="true"></div>
          <p>필름을 거는 중…</p>
        </div>

        <!-- 카운트다운 리더 -->
        <div class="leader hidden" id="leader" aria-hidden="true">
          <div class="leader-sweep"></div>
          <div class="leader-cross"></div>
          <div class="leader-ring"></div>
          <span class="leader-num" id="leaderNum">5</span>
        </div>

        <!-- 타이틀 카드 -->
        <div class="film-card hidden" id="titleCard">
          <p class="fc-kicker">B614 PICTURES 上映</p>
          <h1 class="fc-title">B614</h1>
          <p class="fc-sub">The Milky Way</p>
          <p class="fc-line">6학년 14반, 우리들의 이야기</p>
        </div>

        <!-- 사진 몽타주 -->
        <div class="montage hidden" id="montage">
          <img class="montage-img" id="imgA" alt="" />
          <img class="montage-img" id="imgB" alt="" />
          <span class="montage-year" id="montageYear"></span>
        </div>

        <!-- 종료 카드 -->
        <div class="film-card hidden" id="endCard">
          <p class="fc-line">곧, 우리들의 이야기로</p>
          <h2 class="fc-end">입장합니다</h2>
        </div>

        <!-- 필름 질감 오버레이 -->
        <div class="grain" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>
        <div class="gate-flicker" aria-hidden="true"></div>
      </div>
    </div>

    <button class="skip-btn" id="skipBtn" type="button">건너뛰기 ▸</button>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/bridge.js"></script>
</body>
</html>
