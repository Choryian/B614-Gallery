<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>전시실 · B614</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="page-room">
  <div class="room-bg" aria-hidden="true"></div>

  <header class="room-head">
    <a class="back-link" href="lobby.html" aria-label="로비로 돌아가기">← 로비</a>
    <div class="room-head-mid">
      <p class="room-kicker" id="roomPeriod"></p>
      <h1 class="room-title" id="roomTitle">전시실</h1>
    </div>
    <p class="room-count" id="roomCount"></p>
  </header>

  <!-- 방 진입 내레이션 오버레이 -->
  <div class="room-intro-overlay" id="roomIntroOverlay" role="dialog" aria-modal="true">
    <div class="room-intro-inner">
      <p class="room-intro-kicker" id="introKicker"></p>
      <h2 class="room-intro-title" id="introRoomTitle"></h2>
      <p class="room-intro-text" id="introNarration"></p>
      <button class="enter-btn" id="enterRoomBtn">입장</button>
    </div>
  </div>

  <main class="gallery" id="gallery" aria-label="전시물"></main>

  <!-- 라이트박스 -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="전시물 확대 보기">
    <button class="lb-close" id="lbClose" aria-label="닫기 (Esc)">×</button>
    <button class="lb-nav lb-prev" id="lbPrev" aria-label="이전">‹</button>
    <button class="lb-nav lb-next" id="lbNext" aria-label="다음">›</button>
    <div class="lb-stage" id="lbStage"></div>
  </div>

  <!-- 방 하단 이동 -->
  <footer class="room-foot">
    <a class="room-move prev-room" id="prevRoom">‹ 이전 전시실</a>
    <button class="room-move to-lobby" id="toLobby">전시실 목록</button>
    <a class="room-move next-room" id="nextRoom">다음 전시실 ›</a>
  </footer>

  <script src="js/auth.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/room.js"></script>
</body>
</html>
