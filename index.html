<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>B614 — The Milky Way</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/enter.css" />
</head>
<body class="page-enter">
  <canvas id="starfield" aria-hidden="true"></canvas>

  <main class="enter-stage">
    <div class="cover-frame">
      <picture>
        <source srcset="assets/cover/p001.webp" type="image/webp" />
        <img src="assets/cover/p001.jpg" alt="B614 사진 앨범 표지 — 6학년 14반, 우리들의 이야기" />
      </picture>
    </div>

    <form id="gateForm" class="gate" autocomplete="off">
      <label class="gate-label" for="pw">입장 비밀번호</label>
      <div class="gate-row">
        <input type="password" id="pw" name="pw" inputmode="text"
               placeholder="• • • • • • • •" aria-describedby="gateMsg" />
        <button type="submit" class="gate-btn">입장</button>
      </div>
      <p class="gate-msg" id="gateMsg" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script src="js/auth.js"></script>
  <script src="js/starfield.js"></script>
  <script src="js/enter.js"></script>
</body>
</html>
