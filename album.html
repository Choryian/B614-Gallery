<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow" />
  <title>B614 사진 앨범</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@400;600&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/album.css" />
</head>
<body class="page-album">

  <main class="stage" id="stage">
    <img class="page-img" id="imgA" alt="" />
    <img class="page-img" id="imgB" alt="" />
    <div class="loading" id="loading" aria-hidden="true"></div>
  </main>

  <button class="navzone prev" id="prevZone" type="button" aria-label="이전 페이지">
    <svg class="arrow" viewBox="0 0 24 40" fill="none" aria-hidden="true">
      <path d="M19 3 4 20l15 17" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <button class="navzone next" id="nextZone" type="button" aria-label="다음 페이지">
    <svg class="arrow" viewBox="0 0 24 40" fill="none" aria-hidden="true">
      <path d="M5 3l15 17L5 37" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <a class="finis ghost-link" id="finis" href="album.html?p=1">처음으로 ↺</a>

  <p class="rotate-hint" id="rotateHint">화면을 가로로 돌리면 더 크게 볼 수 있어요</p>

  <div class="rail" id="rail">
    <nav class="years" id="years" aria-label="연도로 이동"></nav>
    <p class="counter" id="counter" role="status" aria-live="polite"></p>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/album.js"></script>
</body>
</html>
